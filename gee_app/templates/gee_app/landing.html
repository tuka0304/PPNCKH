<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Dữ Liệu Vệ Tinh (GEE)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
        #vanta-canvas {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
    </style>
    <!-- Vanta.js and Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
</head>
<body class="text-white relative bg-slate-900">

    <!-- Vanta Background -->
    <div id="vanta-canvas"></div>

    <!-- Main Content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full px-4 sm:px-6 lg:px-8 text-center">
        <div class="glass-panel p-10 md:p-16 rounded-3xl max-w-4xl shadow-2xl transition-transform transform hover:scale-[1.02] duration-500">
            
            <div class="mb-6 flex justify-center">
                <div class="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                    <svg class="w-12 h-12 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight mb-4 glow-text">
                WebGIS & Google Earth Engine
            </h1>
            
            <p class="text-lg md:text-xl text-blue-100 font-light mb-10 max-w-2xl mx-auto leading-relaxed">
                Nền tảng phân tích không gian và giải đoán ảnh vệ tinh trực tuyến. Tự động hóa trích xuất dữ liệu đa thời gian với tốc độ và độ chính xác cao.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="{% url 'home' %}" class="inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-blue-900 bg-white rounded-full hover:bg-blue-50 transition-all shadow-[0_0_20px_rgba(255,255,255,0.4)] hover:shadow-[0_0_30px_rgba(255,255,255,0.6)] hover:-translate-y-1">
                    Bắt đầu khám phá
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </a>
            </div>

            <div class="mt-12 pt-8 border-t border-white/20 grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="text-3xl font-bold text-white mb-1">Big Data</div>
                    <div class="text-xs text-blue-200 uppercase tracking-wider">Xử lý hàng tỷ Pixel</div>
                </div>
                <div>
                    <div class="text-3xl font-bold text-white mb-1">Serverless</div>
                    <div class="text-xs text-blue-200 uppercase tracking-wider">Không cần QGIS</div>
                </div>
                <div>
                    <div class="text-3xl font-bold text-white mb-1">AI Cloud</div>
                    <div class="text-xs text-blue-200 uppercase tracking-wider">Tự động Giải đoán</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Initialize Vanta.js -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            VANTA.GLOBE({
                el: "#vanta-canvas",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0x3b82f6,
                color2: 0xffffff,
                size: 1.20,
                backgroundColor: 0x0f172a
            })
        });
    </script>
</body>
</html>
